<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI로 포켓몬 찾기 ⚡</title>
    
    <style>
        :root {
            --bg-cream: #FFFDF0;
            --card-cream: #FFF9E6;
            --primary-yellow: #FFD54F;
            --dark-yellow: #F59E0B;
            --warm-orange: #D97706;
            --text-dark: #4A3E3D;
            --text-muted: #78350F;
            --accent-red: #EF4444;
            --accent-red-hover: #DC2626;
            --card-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.15), 0 8px 10px -6px rgba(217, 119, 6, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', '맑은 고딕', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            line-height: 1.5;
        }

        .app-container {
            width: 100%;
            max-width: 620px;
            background-color: var(--card-cream);
            border: 4px solid var(--primary-yellow);
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            padding: 36px 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--warm-orange);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header-subtitle {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 32px;
            word-break: keep-all;
        }

        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .mbti-btn {
            background-color: #FFF3C4;
            border: 2.5px solid var(--dark-yellow);
            border-radius: 16px;
            padding: 16px 6px;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 0 var(--dark-yellow);
        }

        .mbti-btn:hover {
            background-color: #FFE082;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--dark-yellow);
        }

        .mbti-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--dark-yellow);
        }

        .result-view {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .mbti-badge {
            background-color: var(--dark-yellow);
            color: #FFFFFF;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 6px 20px;
            border-radius: 30px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .pokemon-emoji {
            font-size: 6.5rem;
            margin: 10px 0;
            line-height: 1;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.12));
            user-select: none;
        }

        .pokemon-name {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--warm-orange);
            margin-bottom: 20px;
            word-break: keep-all;
        }

        .reason-box {
            background-color: #FFFFFF;
            border: 2.5px dashed #FCD34D;
            border-radius: 20px;
            padding: 22px 20px;
            font-size: 1.15rem;
            font-weight: 500;
            line-height: 1.65;
            color: var(--text-dark);
            text-align: left;
            margin-bottom: 20px;
            width: 100%;
            word-break: keep-all;
        }

        .chemistry-card {
            background-color: #FEF3C7;
            border: 2px solid #FDE68A;
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 28px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            word-break: keep-all;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .reset-btn {
            background-color: var(--accent-red);
            color: #FFFFFF;
            border: none;
            border-radius: 16px;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #B91C1C;
            flex: 1;
            max-width: 280px;
        }

        .reset-btn:hover {
            background-color: var(--accent-red-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #B91C1C;
        }

        .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #B91C1C;
        }

        @media (max-width: 520px) {
            .app-container {
                padding: 28px 18px;
            }
            .header-title {
                font-size: 1.8rem;
            }
            .header-subtitle {
                font-size: 1.1rem;
                margin-bottom: 24px;
            }
            .mbti-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .mbti-btn {
                padding: 14px 4px;
                font-size: 1.15rem;
            }
            .pokemon-emoji {
                font-size: 5.5rem;
            }
            .pokemon-name {
                font-size: 2rem;
            }
            .reason-box {
                font-size: 1.05rem;
                padding: 18px 16px;
            }
            .chemistry-card {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <main class="app-container">
        <!-- MBTI 선택 화면 -->
        <section id="selection-screen">
            <h1 class="header-title">
                <span>⚡</span> MBTI로 포켓몬 찾기 <span>⚡</span>
            </h1>
            <p class="header-subtitle">나와 가장 닮은 포켓몬 친구는 누구일까요?</p>
            
            <div class="mbti-grid" id="mbti-grid-container">
                <!-- 자바스크립트로 16개 동적 생성 또는 직접 하드코딩 -->
                <button class="mbti-btn" onclick="selectMBTI('ISTJ')">ISTJ</button>
                <button class="mbti-btn" onclick="selectMBTI('ISFJ')">ISFJ</button>
                <button class="mbti-btn" onclick="selectMBTI('INFJ')">INFJ</button>
                <button class="mbti-btn" onclick="selectMBTI('INTJ')">INTJ</button>
                <button class="mbti-btn" onclick="selectMBTI('ISTP')">ISTP</button>
                <button class="mbti-btn" onclick="selectMBTI('ISFP')">ISFP</button>
                <button class="mbti-btn" onclick="selectMBTI('INFP')">INFP</button>
                <button class="mbti-btn" onclick="selectMBTI('INTP')">INTP</button>
                <button class="mbti-btn" onclick="selectMBTI('ESTP')">ESTP</button>
                <button class="mbti-btn" onclick="selectMBTI('ESFP')">ESFP</button>
                <button class="mbti-btn" onclick="selectMBTI('ENFP')">ENFP</button>
                <button class="mbti-btn" onclick="selectMBTI('ENTP')">ENTP</button>
                <button class="mbti-btn" onclick="selectMBTI('ESTJ')">ESTJ</button>
                <button class="mbti-btn" onclick="selectMBTI('ESFJ')">ESFJ</button>
                <button class="mbti-btn" onclick="selectMBTI('ENFJ')">ENFJ</button>
                <button class="mbti-btn" onclick="selectMBTI('ENTJ')">ENTJ</button>
            </div>
        </section>

        <!-- 결과 화면 -->
        <section id="result-screen" class="result-view">
            <span class="mbti-badge" id="res-mbti">MBTI</span>
            <div class="pokemon-emoji" id="res-emoji">🐾</div>
            <h2 class="pokemon-name" id="res-name">포켓몬 이름</h2>
            
            <div class="reason-box" id="res-reason">
                어울리는 이유 설명이 들어가는 곳입니다.
            </div>

            <div class="chemistry-card" id="res-match">
                ❤️ 잘 맞는 궁합: MBTI (포켓몬)
            </div>

            <div class="btn-group">
                <button class="reset-btn" onclick="resetSelection()">다시 고르기 🔄</button>
            </div>
        </section>
    </main>

    <script>
        const pokemonDatabase = {
            'ISTJ': {
                name: '거북왕',
                emoji: '🐢',
                reason: '원칙을 잘 지키고 신중하며 책임감이 매우 강한 모습이 닮았습니다.<br>어떠한 위기 속에서도 묵묵히 제 자리를 지키며 믿음직한 등껍질처럼 주변을 든든하게 지켜주는 수호자입니다.',
                match: 'ESFP (피카츄)'
            },
            'ISFJ': {
                name: '해피너스',
                emoji: '🥚',
                reason: '주변 사람들을 온화하고 다정하게 보살피는 헌신적인 성품이 닮았습니다.<br>타인의 아픔에 깊이 공감하고 상처받은 마음을 따뜻하게 다독여주는 포근한 기운을 가지고 있습니다.',
                match: 'ESTP (리자몽)'
            },
            'INFJ': {
                name: '가디안',
                emoji: '✨',
                reason: '통찰력이 뛰어나고 깊은 공감 능력과 신비로운 지혜를 지녔습니다.<br>소중한 사람들을 지키기 위해서라면 모든 마음을 다해 아껴주는 진실되고 충직한 스타일입니다.',
                match: 'ENFP (이브이)'
            },
            'INTJ': {
                name: '뮤츠',
                emoji: '🔮',
                reason: '철저한 분석력과 미래를 내다보는 전략적인 사고를 즐기는 지성파입니다.<br>남들과 다른 높은 기준을 세우고, 냉철하고 독립적으로 목표를 향해 나아갑니다.',
                match: 'ENFP (이브이)'
            },
            'ISTP': {
                name: '루카리오',
                emoji: '🐺',
                reason: '상황 판단이 뛰어나고 도구나 기술을 자유자재로 다루는 실전형 해결사입니다.<br>조용하지만 필요한 순간에 침착하고 확실한 과감함을 발휘합니다.',
                match: 'ESFJ (토게피)'
            },
            'ISFP': {
                name: '메타몽',
                emoji: '🫠',
                reason: '온화하고 유연하며 풍부한 감성을 바탕으로 자유롭게 살아갑니다.<br>어떤 환경이나 사람을 만나도 자연스럽게 맞춰주며 포근한 매력을 보여줍니다.',
                match: 'ENTJ (괴력몬)'
            },
            'INFP': {
                name: '치코리타',
                emoji: '🍃',
                reason: '순수하고 낭만적인 이상주의자이며 자기만의 따뜻한 감성을 간직하고 있습니다.<br>상대방에게 다정다감하게 다가가며 세상을 아름답게 바라보는 마음을 가졌습니다.',
                match: 'ENTJ (괴력몬)'
            },
            'INTP': {
                name: '팬텀',
                emoji: '👻',
                reason: '독창적인 호기심이 넘치고 차별화된 생각을 제시하는 아이디어 창고입니다.<br>엉뚱하면서도 유쾌한 매력으로 정해진 틀을 깨부수는 즐거움을 잘 아는 포켓몬입니다.',
                match: 'ENTJ (괴력몬)'
            },
            'ESTP': {
                name: '리자몽',
                emoji: '🔥',
                reason: '스릴과 도전을 두려워하지 않고 에너지와 순발력이 넘쳐납니다.<br>어려운 난관에 봉착해도 당당하게 정면돌파하는 당차고 열정적인 리더 스타일입니다.',
                match: 'ISFJ (해피너스)'
            },
            'ESFP': {
                name: '피카츄',
                emoji: '⚡',
                reason: '어디서나 상큼한 에너지를 전파하며 사람들을 미소 짓게 만드는 명랑한 인싸입니다.<br>톡톡 튀는 사랑스러움과 즐거움으로 주위를 언제나 환하게 밝혀줍니다.',
                match: 'ISTJ (거북왕)'
            },
            'ENFP': {
                name: '이브이',
                emoji: '🦊',
                reason: '무궁무진한 가능성과 풍부한 상상력을 가지고 있는 호기심 대장입니다.<br>어떤 도전이든 즐겁게 받아들이며 다채로운 매력으로 발전해 나가는 유연성을 가졌습니다.',
                match: 'INTJ (뮤츠)'
            },
            'ENTP': {
                name: '로토무',
                emoji: '💡',
                reason: '재치 있는 재담과 똑똑한 머리로 늘 새로움과 변혁을 추구합니다.<br>어떤 기계든 통통 튀어 들어가듯 예상치 못한 아이디어로 모두를 놀라게 만듭니다.',
                match: 'INFJ (가디안)'
            },
            'ESTJ': {
                name: '윈디',
                emoji: '🦁',
                reason: '체계적인 지도력과 강한 책임감으로 정직하고 용맹하게 무리를 이끕니다.<br>약속을 중요시하고 탁월한 조직력으로 주위 사람들에게 강한 신뢰감을 줍니다.',
                match: 'INFP (치코리타)'
            },
            'ESFJ': {
                name: '토게피',
                emoji: '🐣',
                reason: '주변 사람들에게 밝고 행복한 기운과 사랑을 나눠주는 친절한 매개체입니다.<br>따뜻한 관심과 배려로 그룹 전체에 웃음과 평화를 불어넣어 줍니다.',
                match: 'ISTP (루카리오)'
            },
            'ENFJ': {
                name: '망나뇽',
                emoji: '🐉',
                reason: '친절하고 따뜻하면서도 카리스마 있게 다른 이들의 성장을 돕는 든든한 조력자입니다.<br>곤경에 처한 사람을 헤엄쳐서라도 도와주는 넓은 품과 큰 마음을 가졌습니다.',
                match: 'INFP (치코리타)'
            },
            'ENTJ': {
                name: '괴력몬',
                emoji: '🥊',
                reason: '명확한 목표 의식과 넘치는 실행력으로 거침없이 정상을 향해 달립니다.<br>탁월한 리더십과 자신감으로 어떤 장애물이든 시원시원하게 돌파해 냅니다.',
                match: 'INFP (치코리타)'
            }
        };

        /**
         * MBTI 버튼 클릭 시 결과를 화면에 렌더링하는 함수
         */
        function selectMBTI(mbti) {
            const resultData = pokemonDatabase[mbti];
            if (!resultData) return;

            document.getElementById('res-mbti').innerText = mbti;
            document.getElementById('res-emoji').innerText = resultData.emoji;
            document.getElementById('res-name').innerText = resultData.name;
            document.getElementById('res-reason').innerHTML = resultData.reason;
            document.getElementById('res-match').innerText = '❤️ 잘 맞는 궁합: ' + resultData.match;

            // 화면 전환
            document.getElementById('selection-screen').style.display = 'none';
            const resultScreen = document.getElementById('result-screen');
            resultScreen.style.display = 'flex';

            // 페이지 최상단으로 스크롤 이동
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /**
         * '다시 고르기' 버튼 클릭 시 선택 화면으로 되돌리는 함수
         */
        function resetSelection() {
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('selection-screen').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
